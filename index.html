<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HazelQuiz" />
  <title>HazelQuiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%236366f1%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20text-anchor%3D%22middle%22%20font-size%3D%2230%22%20fill%3D%22%23fff%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-weight%3D%22700%22%3EH%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <link rel="stylesheet" href="style.css?v=20261012c" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">H</div>
      <div>
        <h1 class="appname">HazelQuiz</h1>
        <p class="tagline">護理生命科學 · 一關關溫習</p>
      </div>
    </div>
    <div class="top-right">
      <a id="sync-status" class="sync-pill setup" href="#/sync">未開雲端</a>
      <p id="today-label" class="today"></p>
    </div>
  </header>

  <nav class="nav" aria-label="主要">
    <a href="#/" data-nav="levels">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 19V5h4v14H4zm6 0V9h4v10h-4zm6 0v-6h4v6h-4z"/></svg>
      <span>課本</span>
    </a>
    <a href="#/bank" data-nav="bank">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12a1 1 0 0 1 1 1v17l-7-3.5L5 21V4a1 1 0 0 1 1-1z"/></svg>
      <span>生字</span>
    </a>
    <a href="#/review" data-nav="review">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 9h6M8 13h6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M16 8h3a2 2 0 0 1 2 2v9l-3-1.5"/></svg>
      <span>複習</span>
      <span id="due-badge" class="badge" hidden>0</span>
    </a>
  </nav>

  <main id="main"></main>

  <div id="backdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-term" tabindex="-1">
    <div class="sheet-head">
      <div class="sheet-titleblock">
        <h2 id="sheet-term"></h2>
        <p id="sheet-zh" class="gloss"></p>
      </div>
      <button type="button" class="speakbtn" id="sheet-speak" aria-label="發音"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <button type="button" class="iconx" id="sheet-close" aria-label="關閉">×</button>
    </div>
    <p id="sheet-ipa" class="phon" hidden></p>
    <p id="sheet-gloss" class="ex"></p>
    <div class="sheet-actions">
      <button type="button" class="primary" id="sheet-save">加進生字卡持續複習</button>
      <button type="button" class="ghost" id="sheet-remove" hidden>移除</button>
    </div>
    <p class="hint sheet-speak-hint">點右上角喇叭發音 · 長按慢速</p>
    <p id="sheet-note" class="hint" hidden></p>
  </div>

  <noscript>請啟用 JavaScript。HazelQuiz 只在瀏覽器運行。</noscript>
  <script src="config.js?v=20261012c"></script>
  <script src="data.js?v=20261012c"></script>
  <script src="app.js?v=20261012c"></script>
</body>
</html>
